<!DOCTYPE html>
<!--
  Overrides the stock Expo shell (@expo/cli/static/template/index.html).

  `web.output` is "single", and in that mode Expo builds index.html from this
  template and never renders sources/app/+html.tsx — that file only runs for
  static/server output. So mobile-web viewport fixes have to live here.

  Keep the two percent-delimited placeholders below and the single </head> and
  </body> tags: Expo substitutes the placeholders and appends the CSS links and
  bundle <script> tags to the closing tags. Do not repeat a placeholder token
  anywhere above its real use — the substitution is a non-global String.replace,
  so an earlier mention (even in a comment) swallows it and the page ships with
  a literal placeholder as its title.
-->
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!-- viewport-fit=cover is what makes env(safe-area-inset-*) resolve to
         anything but 0, which is how react-native-safe-area-context feeds
         insets to the app on web. Without it the composer has no way to clear
         the home indicator. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
    <!--
      iOS WebKit (Safari and Chrome alike) breaks the reset above two ways: its
      browser toolbar is drawn over the bottom of a `height: 100%` page, and the
      on-screen keyboard never resizes the layout viewport. Either one leaves the
      composer under something you cannot tap through, and `overflow: hidden`
      means you cannot scroll it back into view.

      `dvh` handles the toolbar. --happy-viewport-height (set from visualViewport
      below) additionally handles the keyboard, so the app shell is always
      exactly the region the user can see. Both are skipped while the Tauri
      desktop zoom is active — that scales the body itself and owns its sizing.
    -->
    <style id="happy-mobile-viewport">
      html:not(.happy-app-zoomed),
      html:not(.happy-app-zoomed) body {
        height: 100%;
        height: 100dvh;
      }
      html:not(.happy-app-zoomed) #root {
        height: 100%;
        height: var(--happy-viewport-height, 100dvh);
      }
    </style>
    <script>
      // visualViewport.height is the only value iOS updates when the keyboard opens.
      (function () {
        var vv = window.visualViewport;
        if (!vv) return;
        var root = document.documentElement;
        var queued = false;
        function apply() {
          queued = false;
          if (root.classList.contains('happy-app-zoomed')) {
            root.style.removeProperty('--happy-viewport-height');
            return;
          }
          root.style.setProperty('--happy-viewport-height', vv.height + 'px');
        }
        function schedule() {
          if (queued) return;
          queued = true;
          requestAnimationFrame(apply);
        }
        vv.addEventListener('resize', schedule);
        schedule();
      })();
    </script>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
